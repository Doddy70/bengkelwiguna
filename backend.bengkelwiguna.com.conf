server
{
    listen 80;
    listen 443 ssl http2;
    server_name backend.bengkelwiguna.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/backend.bengkelwiguna.com;
    include /www/server/panel/vhost/nginx/extension/backend.bengkelwiguna.com/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/backend.bengkelwiguna.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #SSL-END
    ssl_certificate    /www/server/panel/vhost/cert/backend.bengkelwiguna.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/backend.bengkelwiguna.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/backend.bengkelwiguna.com.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification
    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # PHP-FPM - ALLOW POST for booking-api.php
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/www/server/php/8.4/root/usr/local/php/84/var/run/www.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    access_log /www/wwwlogs/backend.bengkelwiguna.com.log f2bcdnformat;
    error_log  /www/wwwlogs/backend.bengkelwiguna.com.error.log;
}
