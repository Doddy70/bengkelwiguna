# Environment Configuration — Bengkel Wiguna

## Local Development
```yaml
backend_url: "http://localhost"
frontend_port: 3000
api_base: "/bw/v1/"
wp_api_base: "/wp/v2/"
```

## Staging / Production
```yaml
backend_url: "https://backend.bengkelwiguna.com"
frontend_port: 3000
api_base: "/bw/v1/"
wp_api_base: "/wp/v2/"
```

## API Endpoints

| CPT | List Endpoint | Single Endpoint |
|-----|---------------|------------------|
| Services | `/bw/v1/services-full` | `/bw/v1/services/{slug}` |
| Promosi | `/bw/v1/promosi-full` | `/bw/v1/promosi/{slug}` |
| Paket Service | `/bw/v1/paket-service-full` | `/bw/v1/paket-service/{slug}` |
| Layanan Spesialis | `/bw/v1/layanan-spesialis-full` | `/bw/v1/layanan-spesialis/{slug}` |
| Menus | `/bw/v1/menu-1` | — |

## Transient Cache TTL
- Default: 12 hours
- Version key bump = zero-downtime invalidation

## Build Validation
- Command: `npm run build`
- Target: Zero errors
- Timeout: 5 minutes