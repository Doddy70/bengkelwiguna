# ===========================================
# Bengkel Wiguna — Development Docker Compose
# ===========================================
# Usage: docker compose -f docker-compose.dev.yml up

services:
  # Next.js Development with Hot Reload
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bw-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.local
    volumes:
      - ./src:/app/src:rw
      - ./public:/app/public:ro
      - ./types:/app/types:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bw-dev-network

networks:
  bw-dev-network:
    driver: bridge
