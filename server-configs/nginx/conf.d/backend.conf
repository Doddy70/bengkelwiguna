# ============================================
# WordPress Backend - Nginx Configuration
# Dengan Smush Pro WebP Support
# ============================================

# Upstream untuk PHP-FPM (jika pakai)
# upstream php_backend {
#     server 127.0.0.1:9000;
# }

server {
    listen 80;
    listen [::]:80;
    server_name backend.bengkelwiguna.com;

    # Redirect HTTP to HTTPS (jika pakai SSL)
    # return 301 https://$server_name$request_uri;

    root /var/www/html;
    index index.php index.html index.htm;

    # Logging
    access_log /var/log/nginx/backend.access.log;
    error_log /var/log/nginx/backend.error.log;

    # ============================================
    # SMUSH-WEBP - AUTOMATIC WEBP CONVERSION
    # ============================================
    # Serve WebP images when browser supports it
    # Smush Pro menyimpan WebP di wp-content/smush-webp/

    location ~* "wp-content/(uploads/)(.*\.(?:png|jpe?g))" {
        add_header Vary Accept;

        # Check if Smush WebP disabled
        if (-f "/var/www/html/wp-content/smush-webp/disable_smush_webp") {
            break;
        }

        # Only serve WebP if browser accepts it
        if ($http_accept !~* "webp") {
            break;
        }

        # Cache forever (WebP tidak berubah)
        expires max;
        add_header Cache-Control "public, immutable";

        # Try Smush WebP version first, fallback ke original
        try_files /wp-content/smush-webp/$2.webp $uri =404;
    }

    # ============================================
    # WORDPRESS PERMALINKS & REWRITES
    # ============================================

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ============================================
    # PHP PROCESSING
    # ============================================

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # atau: fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Buffer settings
        fastcgi_buffering off;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ============================================
    # STATIC FILES CACHING
    # ============================================

    location ~* \.(js|css|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS & JS versioning
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================
    # WORDPRESS SPECIFIC
    # ============================================

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to wp-config.php
    location = /wp-config.php {
        deny all;
    }

    # Deny access to readme.html, license.txt, etc.
    location ~ /(^#.*#|\.(txt|md|html|log)|readme|lieseme) {
        deny all;
    }

    # ============================================
    # SECURITY HEADERS
    # ============================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

