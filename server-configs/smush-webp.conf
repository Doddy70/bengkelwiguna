# Nginx WebP Configuration for Smush Pro
# ==========================================

# Include this in your nginx config
# Add to /etc/nginx/conf.d/ or in server block

# SMUSH-WEBP - Serve WebP images when browser supports it
location ~* "wp-content/(uploads/)(.*\.(?:png|jpe?g))" {
    add_header Vary Accept;

    # Check if WebP disabled flag exists
    if (-f "/www/wwwroot/backend.bengkelwiguna.com/wp-content/smush-webp/disable_smush_webp") {
        break;
    }

    # Only serve WebP if browser accepts it
    if ($http_accept !~* "webp") {
        break;
    }

    expires max;
    try_files /wp-content/smush-webp/$2.webp $uri =404;
}
